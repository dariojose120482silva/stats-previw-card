<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Componente de cartão de estatísticas para visualizar dados e impulsionar decisões de negócio.">
    <meta name="author" content="Seu Nome">
    <meta name="keywords" content="estatísticas, dados, analytics, negócios, frontend mentor">
    <meta property="og:title" content="Stats preview card component">
    <meta property="og:description"
      content="Visualize estatísticas importantes para o seu negócio com este componente elegante.">
    <meta property="og:image" content="./images/preview.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Rubik:ital,wght@0,300..900;1,300..900&family=Secular+One&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet">
    <title>Stats preview card | Visualize dados do seu negócio</title>
  </head>
</head>

<body>


  <main class="container">

    <div class="content">
      <div class="text-section">

        <h1>Get <span class="highlight">insights</span> that help your business grow.</h1>

        <p>Discover the benefits of data analytics
          and make better decisions regarding revenue,
          customer experience, and
          overall efficiency.</p>
      </div>

      <div class="stats">
        <ul class="stats-list">
          <li><span class="span">10k+</span> companies</li>
          <li><span class="span">314</span> templates</li>
          <li><span class="span">12M+</span> queries</li>
        </ul>
      </div>
    </div>

    <div class="image-container">
      
      <picture>
        <source media="(min-width: 1024px)" srcset="./images/image-header-desktop.jpg">

        <source media="(min-width: 540px)" srcset="./images/imagem-responsiva-540.jpg">

        <img src="./images/image-header-mobile.jpg" alt="Visualização de estatísticas empresariais"
          class="header-image">
      </picture>

    </div>

  </main>

</body>

</html>
